}
function logForm(l={}){return`
  <div class="form-row"><div class="form-group"><label>Tarih *</label><input type="date" id="l-tarih" value="${l.tarih?l.tarih.slice(0,10):today()}"></div>
  <div class="form-group"><label>Kategori</label><select id="l-kat">${LOG_KAT.map(k=>`<option ${l.kategori===k?'selected':''}>${k}</option>`).join('')}</select></div></div>
  <div class="form-group"><label>Başlık</label><input type="text" id="l-baslik" value="${l.baslik||''}" placeholder="ör: HPLC analizi tamamlandı"></div>
  <div class="form-group"><label>İçerik *</label><textarea id="l-icerik" style="min-height:140px">${l.icerik||''}</textarea></div>`;}
function logYeni(){showModal('Yeni Günlük Log',logForm(),`<button class="btn btn-ghost" onclick="closeModalDirect()">İptal</button><button class="btn btn-primary" onclick="logKaydet()">Kaydet</button>`);}
async function logKaydet(){
  const icerik=document.getElementById('l-icerik').value.trim();const tarih=document.getElementById('l-tarih').value;if(!icerik||!tarih){toast('İçerik ve tarih zorunlu.','err');return;}
  const u=C.Users.find(x=>x.username===currentUser.username);
  C.GunlukLog.push({id:uid(),kullanici:currentUser.username,kullaniciAd:u?u.ad||u.username:currentUser.username,tarih,kategori:document.getElementById('l-kat').value,baslik:document.getElementById('l-baslik').value,icerik,duzenlendi:'false',duzenlemeTarihi:''});
  closeModalDirect();loading(true,'Kaydediliyor...');try{await save('GunlukLog');loading(false);toast('Log kaydedildi ✓');renderGunluk(lKul,lKat);}catch(e){loading(false);toast('Hata: '+e.message,'err');}
}
function logDuzenle(id){const l=C.GunlukLog.find(x=>x.id===id);if(!l)return;if(l.kullanici!==currentUser.username&&!canDelete()){toast('Sadece kendi loglarınızı düzenleyebilirsiniz.','err');return;}showModal('Log Düzenle',logForm(l),`<button class="btn btn-ghost" onclick="closeModalDirect()">İptal</button><button class="btn btn-primary" onclick="logGuncelle('${id}')">Güncelle</button>`);}
async function logGuncelle(id){
  const icerik=document.getElementById('l-icerik').value.trim();const tarih=document.getElementById('l-tarih').value;if(!icerik||!tarih){toast('İçerik ve tarih zorunlu.','err');return;}
  const idx=C.GunlukLog.findIndex(x=>x.id===id);const on={...C.GunlukLog[idx]};
  C.GunlukLog[idx]={...C.GunlukLog[idx],tarih,kategori:document.getElementById('l-kat').value,baslik:document.getElementById('l-baslik').value,icerik,duzenlendi:'true',duzenlemeTarihi:new Date().toISOString()};
  logDuz('GunlukLog',id,on,C.GunlukLog[idx]);closeModalDirect();loading(true,'Güncelleniyor...');try{await save('GunlukLog');loading(false);toast('Güncellendi ✓');renderGunluk(lKul,lKat);}catch(e){loading(false);toast('Hata: '+e.message,'err');}
}
async function logSil(id){if(!confirm('Emin misiniz?'))return;C.GunlukLog=C.GunlukLog.filter(x=>x.id!==id);loading(true);try{await save('GunlukLog');loading(false);toast('Silindi.','err');renderGunluk(lKul,lKat);}catch(e){loading(false);toast('Hata: '+e.message,'err');}}

function rapor(){
  document.getElementById('content').innerHTML=`
    <div class="grid-2 gap-16 mb-24">
      <div class="card"><div class="card-header"><span class="card-title">Excel Export</span></div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <button class="btn btn-success" onclick="xExport('Stok','Stok_Durumu')">↓ Stok Durumu</button>
          <button class="btn btn-success" onclick="xExport('Cikti','Cikti_Kayitlari')">↓ Çıktı Kayıtları</button>
          <button class="btn btn-success" onclick="xExport('Analiz','Analiz_Sonuclari')">↓ Analiz Sonuçları</button>
          <button class="btn btn-success" onclick="xExport('Ekipman','Ekipman_Listesi')">↓ Ekipman Listesi</button>
          <button class="btn btn-success" onclick="xExport('KalibTarihce','Kalibrasyon_Tarihcesi')">↓ Kalibrasyon Tarihçesi</button>
          <button class="btn btn-success" onclick="xExport('Temizlik','Temizlik_Plani')">↓ Temizlik Planı</button>
          <button class="btn btn-amber" onclick="xExportAll()">↓ Tümünü İndir</button>
        </div>
      </div>
      <div class="card"><div class="card-header"><span class="card-title">Veri Özeti</span></div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${[['Stok Kalemi',C.Stok.length,'stat-blue'],['Çıktı Kaydı',C.Cikti.length,'stat-purple'],['Analiz Kaydı',C.Analiz.length,'stat-amber'],['Ekipman',C.Ekipman.length,'stat-blue'],['Kritik Stok',C.Stok.filter(s=>s.miktar<=(s.kritikSeviye||0)).length,'stat-red'],['Temizlik Görevi',C.Temizlik.length,'stat-teal']].map(([l,v,cls])=>`
          <div class="flex justify-between items-center" style="padding:8px 0;border-bottom:1px solid var(--border)">
            <span style="font-size:13px;color:var(--text2)">${l}</span>
            <span class="text-mono ${cls}" style="font-size:18px;font-weight:600">${v}</span>
          </div>`).join('')}
        </div>
        <div class="mt-16">
          <a href="https://docs.google.com/spreadsheets/d/1Mx5zKqbVz3P8nqZhVc6vtpQ_Hb594k42NMoF9ascawI/edit" target="_blank" class="btn btn-ghost btn-sm w-full" style="justify-content:center">Google Sheets'i Aç ↗</a>
        </div>
      </div>
    </div>`;
}
function xExport(key,name){const d=C[key];if(!d.length){toast('Bu modülde kayıt yok.','err');return;}const ws=XLSX.utils.json_to_sheet(d.map(r=>{const{id,...rest}=r;return rest;}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,name);XLSX.writeFile(wb,`Arsen_${name}_${new Date().toISOString().slice(0,10)}.xlsx`);toast('Excel indirildi ✓');}
function xExportAll(){const wb=XLSX.utils.book_new();[['Stok','Stok'],['Cikti','Cikti'],['Analiz','Analiz'],['Ekipman','Ekipman'],['KalibTarihce','KalibTarihce'],['Temizlik','Temizlik']].forEach(([k,n])=>{const ws=XLSX.utils.json_to_sheet(C[k].length?C[k].map(r=>{const{id,...rest}=r;return rest;}):[{}]);XLSX.utils.book_append_sheet(wb,ws,n);});XLSX.writeFile(wb,`Arsen_Lab_Rapor_${new Date().toISOString().slice(0,10)}.xlsx`);toast('Tam rapor indirildi ✓');}

// ── ADMİN ──
function admin(){
  if(!canDelete()){document.getElementById('content').innerHTML='<div class="empty-state"><div class="empty-icon">⊘</div><div>Erişim yetkiniz yok.</div></div>';return;}
  document.getElementById('topbar-actions').innerHTML=`<button class="btn btn-primary btn-sm" onclick="kullaniciYeni()">+ Yeni Kullanıcı</button>`;renderAdmin();
}
function renderAdmin(){
  document.getElementById('content').innerHTML=`<div class="table-wrap"><table><thead><tr><th>Ad Soyad</th><th>Kullanıcı Adı</th><th>Rol</th><th>Durum</th><th>Oluşturma</th><th>İşlem</th></tr></thead><tbody>${C.Users.map(u=>`<tr>
    <td class="td-main">${u.ad||'—'}</td><td class="text-mono">${u.username}</td>
    <td><span class="badge ${u.role==='admin'?'badge-blue':'badge-gray'}">${u.role==='admin'?'Admin':'Kullanıcı'}</span></td>
    <td><span class="badge ${u.active===true||u.active==='true'?'badge-green':'badge-red'}">${u.active===true||u.active==='true'?'Aktif':'Pasif'}</span></td>
    <td class="text-mono" style="font-size:11px">${fmt(u.olusturma)}</td>
    <td>${u.id!==currentUser.id?`<button class="btn btn-ghost btn-sm" onclick="kullaniciDuzenle('${u.id}')">Düzenle</button><button class="btn btn-${u.active===true||u.active==='true'?'danger':'success'} btn-sm" onclick="kullaniciToggle('${u.id}')">${u.active===true||u.active==='true'?'Pasif Et':'Aktif Et'}</button>`:'<span class="text-muted text-sm">Mevcut oturum</span>'}</td>
  </tr>`).join('')}</tbody></table></div>`;}
function uForm(u={}){return`
  <div class="form-row"><div class="form-group"><label>Ad Soyad *</label><input type="text" id="u-ad" value="${u.ad||''}"></div>
  <div class="form-group"><label>Kullanıcı Adı *</label><input type="text" id="u-un" value="${u.username||''}" ${u.id?'readonly':''}></div></div>
  <div class="form-row"><div class="form-group"><label>${u.id?'Yeni Şifre (boş=değişmez)':'Şifre *'}</label><input type="password" id="u-pass" placeholder="••••••••"></div>
  <div class="form-group"><label>Rol</label><select id="u-rol"><option value="user" ${u.role==='user'?'selected':''}>Kullanıcı</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin</option></select></div></div>`;}
function kullaniciYeni(){showModal('Yeni Kullanıcı',uForm(),`<button class="btn btn-ghost" onclick="closeModalDirect()">İptal</button><button class="btn btn-primary" onclick="kullaniciKaydet()">Kaydet</button>`);}
async function kullaniciKaydet(){const ad=document.getElementById('u-ad').value.trim();const un=document.getElementById('u-un').value.trim();const p=document.getElementById('u-pass').value;if(!ad||!un||!p){toast('Tüm alanlar zorunlu.','err');return;}if(C.Users.find(u=>u.username===un)){toast('Bu kullanıcı adı zaten var.','err');return;}C.Users.push({id:uid(),ad,username:un,passwordHash:hash(p),role:document.getElementById('u-rol').value,active:'true',olusturma:new Date().toISOString()});closeModalDirect();loading(true,'Kaydediliyor...');try{await save('Users');loading(false);toast('Kullanıcı eklendi ✓');renderAdmin();}catch(e){loading(false);toast('Hata: '+e.message,'err');}}
function kullaniciDuzenle(id){const u=C.Users.find(x=>x.id===id);if(!u)return;showModal('Kullanıcı Düzenle',uForm(u),`<button class="btn btn-ghost" onclick="closeModalDirect()">İptal</button><button class="btn btn-primary" onclick="kullaniciGuncelle('${id}')">Güncelle</button>`);}
async function kullaniciGuncelle(id){const ad=document.getElementById('u-ad').value.trim();if(!ad){toast('Ad zorunlu.','err');return;}const idx=C.Users.findIndex(x=>x.id===id);const p=document.getElementById('u-pass').value;C.Users[idx]={...C.Users[idx],ad,role:document.getElementById('u-rol').value};if(p)C.Users[idx].passwordHash=hash(p);closeModalDirect();loading(true,'Güncelleniyor...');try{await save('Users');loading(false);toast('Güncellendi ✓');renderAdmin();}catch(e){loading(false);toast('Hata: '+e.message,'err');}}
async function kullaniciToggle(id){const idx=C.Users.findIndex(x=>x.id===id);C.Users[idx].active=C.Users[idx].active==='true'||C.Users[idx].active===true?'false':'true';loading(true);try{await save('Users');loading(false);toast('Güncellendi ✓');renderAdmin();}catch(e){loading(false);toast('Hata: '+e.message,'err');}}
</script>
</body>
</html>
