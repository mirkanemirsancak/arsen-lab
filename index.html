<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arşen Proses — Lab Takip</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#0f1117;--bg2:#161922;--bg3:#1e2330;--border:#2a3044;--border2:#374060;--text:#e8eaf0;--text2:#8892aa;--text3:#4a5570;--accent:#4f9cf9;--accent2:#2d7dd2;--green:#3ecf8e;--amber:#f5a623;--red:#e74c3c;--purple:#9b59b6;--teal:#1abc9c;--radius:8px;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;}
::-webkit-scrollbar{width:6px;height:6px;}::-webkit-scrollbar-track{background:var(--bg2);}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);position:relative;overflow:hidden;}
#login-screen::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 40%,rgba(79,156,249,0.06) 0%,transparent 60%),radial-gradient(ellipse at 70% 70%,rgba(62,207,142,0.04) 0%,transparent 50%);}
.login-box{width:380px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:40px;position:relative;z-index:1;}
.login-logo{margin-bottom:34px;text-align:center;}.login-logo img{width:250px;height:auto;max-height:138px;display:block;margin:0 auto;object-fit:contain;}.login-logo .brand{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:3px;text-transform:uppercase;margin-bottom:4px;}
.login-logo h1{font-size:22px;font-weight:600;}.login-logo span{color:var(--accent);}.login-subtitle{font-size:12px;color:var(--text3);margin-top:2px;}
.login-err{color:var(--red);font-size:12px;margin-top:10px;display:none;}
label{display:block;font-size:11px;font-weight:500;color:var(--text2);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;margin-top:16px;}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=week],select,textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--sans);font-size:14px;padding:10px 12px;outline:none;transition:border-color 0.2s;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}textarea{resize:vertical;min-height:80px;}select option{background:var(--bg3);}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:var(--radius);border:none;font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;transition:all 0.15s;}
.btn-primary{background:var(--accent);color:#fff;}.btn-primary:hover{background:var(--accent2);}
.btn-success{background:var(--green);color:#0a2a1e;}.btn-success:hover{filter:brightness(0.9);}
.btn-danger{background:var(--red);color:#fff;}.btn-danger:hover{filter:brightness(0.85);}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border);}.btn-ghost:hover{border-color:var(--border2);color:var(--text);background:var(--bg3);}
.btn-amber{background:var(--amber);color:#1a0f00;}.btn-full{width:100%;justify-content:center;}.btn-sm{padding:6px 12px;font-size:12px;}
#loading-overlay{position:fixed;inset:0;background:rgba(15,17,23,0.85);z-index:9998;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;}
#loading-overlay.show{display:flex;}.spinner{width:32px;height:32px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}.loading-text{font-size:13px;color:var(--text2);font-family:var(--mono);}
#app{display:none;height:100vh;overflow:hidden;}#app.visible{display:flex;}
.sidebar{width:220px;min-width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow-y:auto;}
.sidebar-header{padding:18px 16px;border-bottom:1px solid var(--border);text-align:center;}
.sidebar-logo{width:178px;height:auto;max-height:96px;display:block;margin:0 auto;object-fit:contain;}
.sidebar-brand{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:2px;margin-bottom:2px;}
.sidebar-title{font-size:15px;font-weight:600;}.sidebar-title span{color:var(--accent);}
.sidebar-user{padding:12px 16px;border-bottom:1px solid var(--border);font-size:11px;color:var(--text3);}
.sidebar-user strong{color:var(--text2);display:block;font-size:12px;}
.sync-status{padding:8px 16px;border-bottom:1px solid var(--border);font-size:11px;font-family:var(--mono);}
.sync-ok{color:var(--green);}.sync-err{color:var(--red);}.sync-loading{color:var(--amber);}
nav{flex:1;padding:8px 0;}
.nav-section{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:2px;padding:12px 16px 4px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;color:var(--text2);cursor:pointer;transition:all 0.15s;font-size:13px;border-left:2px solid transparent;}
.nav-item:hover{color:var(--text);background:var(--bg3);}.nav-item.active{color:var(--accent);background:rgba(79,156,249,0.07);border-left-color:var(--accent);}
.nav-icon{font-size:16px;width:20px;text-align:center;}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-family:var(--mono);padding:1px 6px;border-radius:10px;min-width:18px;text-align:center;}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{height:52px;min-height:52px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;}
.topbar-title{font-size:16px;font-weight:600;min-width:140px;}
.topbar-search{flex:1;position:relative;max-width:360px;}
.topbar-search input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--sans);font-size:13px;padding:7px 12px 7px 32px;outline:none;}
.topbar-search input:focus{border-color:var(--accent);}
.topbar-search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none;}
#global-search-results{position:absolute;top:38px;left:0;right:0;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);z-index:500;max-height:320px;overflow-y:auto;display:none;}
.gsr-item{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border);font-size:12px;}
.gsr-item:hover{background:var(--bg3);}.gsr-item:last-child{border-bottom:none;}
.gsr-mod{font-family:var(--mono);font-size:10px;color:var(--text3);margin-bottom:2px;}
.gsr-name{color:var(--text);font-weight:500;}
.content{flex:1;overflow-y:auto;padding:24px;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}.card-title{font-size:14px;font-weight:600;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;}
.stat-label{font-size:11px;color:var(--text3);font-family:var(--mono);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.stat-value{font-size:28px;font-weight:600;font-family:var(--mono);}.stat-sub{font-size:11px;color:var(--text3);margin-top:4px;}
.stat-green{color:var(--green);}.stat-amber{color:var(--amber);}.stat-red{color:var(--red);}.stat-blue{color:var(--accent);}
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;}thead tr{background:var(--bg3);}
th{text-align:left;padding:10px 14px;font-size:11px;font-weight:500;color:var(--text3);font-family:var(--mono);letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text2);font-size:13px;vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}tbody tr:hover td{background:var(--bg3);}.td-main{color:var(--text);font-weight:500;}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-family:var(--mono);font-weight:500;}
.badge-green{background:rgba(62,207,142,0.15);color:var(--green);}.badge-amber{background:rgba(245,166,35,0.15);color:var(--amber);}
.badge-red{background:rgba(231,76,60,0.15);color:var(--red);}.badge-blue{background:rgba(79,156,249,0.15);color:var(--accent);}
.badge-purple{background:rgba(155,89,182,0.15);color:var(--purple);}.badge-teal{background:rgba(26,188,156,0.15);color:var(--teal);}
.badge-gray{background:rgba(255,255,255,0.05);color:var(--text3);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}.modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-size:15px;font-weight:600;}.modal-close{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;padding:0 4px;line-height:1;}
.modal-body{padding:20px 24px;}.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
.alert{padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:16px;}
.alert-amber{background:rgba(245,166,35,0.1);border:1px solid rgba(245,166,35,0.3);color:var(--amber);}
.alert-red{background:rgba(231,76,60,0.1);border:1px solid rgba(231,76,60,0.3);color:var(--red);}
.alert-green{background:rgba(62,207,142,0.1);border:1px solid rgba(62,207,142,0.3);color:var(--green);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}.form-group{margin-bottom:4px;}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.progress-bar{background:var(--bg3);border-radius:4px;height:6px;overflow:hidden;}.progress-fill{height:100%;border-radius:4px;transition:width 0.3s;}
.search-bar{position:relative;}.search-bar input{padding-left:36px;}.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none;}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.filter-btn{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12px;cursor:pointer;font-family:var(--sans);transition:all 0.15s;}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(79,156,249,0.08);}
.empty-state{text-align:center;padding:48px 24px;color:var(--text3);}.empty-icon{font-size:40px;margin-bottom:12px;}
#toast{position:fixed;bottom:24px;right:24px;z-index:9999;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:12px 18px;font-size:13px;color:var(--text);transform:translateY(100px);opacity:0;transition:all 0.3s;max-width:320px;}
#toast.show{transform:translateY(0);opacity:1;}#toast.toast-ok{border-color:var(--green);color:var(--green);}#toast.toast-err{border-color:var(--red);color:var(--red);}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:20px;}
.tab{padding:8px 16px;font-size:13px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.15s;}
.tab:hover{color:var(--text);}.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.schedule-meta{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
.schedule-title{font-size:18px;font-weight:600;}.schedule-sub{font-size:12px;color:var(--text3);margin-top:4px;}
.schedule-title[contenteditable],.schedule-sub[contenteditable]{outline:none;border-bottom:1px dashed transparent;}.schedule-title[contenteditable]:focus,.schedule-sub[contenteditable]:focus{border-bottom-color:var(--accent);}
.schedule-legend{display:flex;gap:10px;flex-wrap:wrap;}.schedule-leg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2);font-family:var(--mono);}
.schedule-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}.schedule-dot.red{background:var(--red);}.schedule-dot.amber{background:var(--amber);}.schedule-dot.teal{background:var(--green);}.schedule-dot.blue{background:var(--accent);}
.schedule-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.schedule-table{min-width:920px;}.schedule-person{background:rgba(255,255,255,0.025);min-width:130px;}.schedule-person strong{display:block;color:var(--text);font-size:13px;}.schedule-person span{display:block;color:var(--text3);font-size:11px;margin-top:3px;}
.schedule-person-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.schedule-mini{font-size:10px;padding:3px 7px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;}.schedule-mini:hover{border-color:var(--accent);color:var(--accent);}.schedule-mini.danger:hover{border-color:var(--red);color:var(--red);}
.schedule-task{display:flex;align-items:flex-start;gap:7px;margin-bottom:7px;line-height:1.45;}.schedule-task:last-child{margin-bottom:0;}.schedule-task span{font-size:12px;color:var(--text2);}
.schedule-task.done span{text-decoration:line-through;color:var(--text3);}
.schedule-priority{width:8px;height:8px;border-radius:50%;flex:0 0 8px;margin-top:5px;box-shadow:0 0 0 3px rgba(255,255,255,0.03);}
.schedule-priority.red{background:var(--red);}.schedule-priority.amber{background:var(--amber);}.schedule-priority.teal{background:var(--green);}.schedule-priority.blue{background:var(--accent);}
.schedule-remove{margin-left:auto;border:0;background:transparent;color:var(--text3);cursor:pointer;font-size:12px;}.schedule-remove:hover{color:var(--red);}
.schedule-select{accent-color:var(--accent);margin-top:2px;}.schedule-add{display:inline-block;margin-top:4px;border:1px dashed var(--border2);border-radius:4px;padding:3px 8px;font-size:11px;color:var(--text3);cursor:pointer;}.schedule-add:hover{color:var(--accent);border-color:var(--accent);}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.file-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px;min-height:156px;}
.file-card:hover{border-color:var(--border2);background:#191d28;}.file-icon{width:36px;height:36px;border-radius:6px;background:rgba(79,156,249,0.12);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.file-name{font-weight:600;color:var(--text);word-break:break-word;line-height:1.35;}.file-meta{font-size:11px;color:var(--text3);font-family:var(--mono);line-height:1.55;}
.file-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;}.file-drop{border:1px dashed var(--border2);border-radius:var(--radius);padding:18px;background:rgba(255,255,255,0.02);color:var(--text2);}
.file-drop input[type=file]{margin-top:10px;color:var(--text2);font-family:var(--sans);font-size:13px;}
.mesai-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.mesai-note{max-width:320px;white-space:normal;line-height:1.45;}
.mesai-status{white-space:nowrap;}
.group-header{background:var(--bg3);padding:8px 14px;font-size:11px;font-family:var(--mono);color:var(--text3);letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--border);}
.stok-info{display:inline-block;font-size:11px;color:var(--green);font-family:var(--mono);margin-left:8px;}
.stock-group{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px;background:var(--bg2);}
.stock-group-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--bg3);border:0;color:var(--text);cursor:pointer;text-align:left;font-family:var(--sans);}
.stock-group-head:hover{background:#242a39;}.stock-group-title{font-weight:600;font-size:13px;}.stock-group-meta{font-size:11px;color:var(--text3);font-family:var(--mono);}
.stock-location{padding:10px 14px;border-top:1px solid var(--border);font-size:11px;font-family:var(--mono);color:var(--text3);letter-spacing:1px;text-transform:uppercase;background:rgba(255,255,255,0.02);}
.flex{display:flex;}.items-center{align-items:center;}.justify-between{justify-content:space-between;}
.gap-8{gap:8px;}.gap-12{gap:12px;}.gap-16{gap:16px;}.mb-8{margin-bottom:8px;}.mb-16{margin-bottom:16px;}.mb-24{margin-bottom:24px;}.mt-8{margin-top:8px;}.mt-16{margin-top:16px;}
.text-muted{color:var(--text2);}.text-sm{font-size:12px;}.text-mono{font-family:var(--mono);}.w-full{width:100%;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <img src="assets/arsen-process-mark.png?v=4" alt="Arşen Process">
    </div>
    <div class="form-group"><label>Kullanıcı Adı</label><input type="text" id="login-user" placeholder="kullanici_adi" autocomplete="username"></div>
    <div class="form-group"><label>Şifre</label><input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password"></div>
    <div class="login-err" id="login-err">Kullanıcı adı veya şifre hatalı.</div>
    <button class="btn btn-primary btn-full mt-16" onclick="doLogin()">Giriş Yap</button>
  </div>
</div>

<div id="loading-overlay"><div class="spinner"></div><div class="loading-text" id="loading-text">Yükleniyor...</div></div>

<div id="app">
  <div class="sidebar">
    <div class="sidebar-header"><img class="sidebar-logo" src="assets/arsen-process-mark.png?v=4" alt="Arşen Process"></div>
    <div class="sidebar-user"><span>Oturum</span><strong id="sidebar-username">—</strong><span id="sidebar-role" class="badge badge-blue" style="margin-top:4px;font-size:10px;"></span></div>
    <div class="sync-status" id="sync-status"><span class="sync-ok">● Bağlı</span></div>
    <nav>
      <div class="nav-section">Genel</div>
      <div class="nav-item active" onclick="showPage('dashboard')"><span class="nav-icon">◈</span> Dashboard</div>
      <div class="nav-section">Modüller</div>
      <div class="nav-item" onclick="showPage('stok')"><span class="nav-icon">◉</span> Stok Takibi <span class="nav-badge" id="stok-badge" style="display:none">0</span></div>
      <div class="nav-item" onclick="showPage('cikti')"><span class="nav-icon">↑</span> Çıktı Takibi</div>
      <div class="nav-item" onclick="showPage('analiz')"><span class="nav-icon">⌬</span> Analiz Sonuçları</div>
      <div class="nav-item" onclick="showPage('ekipman')"><span class="nav-icon">⚙</span> Ekipman Takibi <span class="nav-badge" id="ekip-badge" style="display:none">0</span></div>
      <div class="nav-item" onclick="showPage('temizlik')"><span class="nav-icon">✦</span> Temizlik Planı</div>
      <div class="nav-section">Ekip</div>
      <div class="nav-item" onclick="showPage('takvim')"><span class="nav-icon">▦</span> Görev Takvimi</div>
      <div class="nav-item" onclick="showPage('mesai')"><span class="nav-icon">◷</span> Ekstra Mesai <span class="nav-badge" id="mesai-badge" style="display:none">0</span></div>
      <div class="nav-item" onclick="showPage('dosyalar')"><span class="nav-icon">▣</span> Dosya Depolama</div>
      <div class="nav-item" onclick="showPage('gunluk')"><span class="nav-icon">✎</span> Günlük Log</div>
      <div class="nav-item" onclick="showPage('rapor')"><span class="nav-icon">▤</span> Raporlama</div>
      <div class="nav-section" id="admin-nav-section">Yönetim</div>
      <div class="nav-item" id="admin-nav-item" onclick="showPage('admin')"><span class="nav-icon">◎</span> Kullanıcılar</div>
    </nav>
    <div class="sidebar-footer">
      <button class="btn btn-ghost btn-sm w-full" onclick="syncAll().then(()=>showPage(currentPage,true))">↺ Yenile</button>
      <button class="btn btn-ghost btn-sm w-full" onclick="doLogout()">Çıkış Yap</button>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <span class="topbar-title" id="page-title">Dashboard</span>
      <div class="topbar-search">
        <span class="topbar-search-icon">⌕</span>
        <input type="text" placeholder="Tüm modüllerde ara..." id="gsi" autocomplete="off">

// ── API ──
async function apiRead(sheet){
  const r=await fetch(`${SCRIPT_URL}?action=read&sheet=${encodeURIComponent(sheet)}`);
  const d=await r.json();if(d.error)throw new Error(d.error);
  const rows=d.values||[];if(rows.length<2)return[];
  const h=rows[0];return rows.slice(1).map(row=>{const o={};h.forEach((k,i)=>o[k]=row[i]!==undefined?String(row[i]):'');return o;});
}
async function apiWrite(sheet,records){
  const cols=COLS[sheet];const values=[cols];
  records.forEach(r=>values.push(cols.map(c=>r[c]!==undefined&&r[c]!==null?String(r[c]):'')));
  const res=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({sheet,action:'write',values})});
  const d=await res.json();if(d.error)throw new Error(d.error);
}
function parseRow(k,r){
  if(k==='Users'){r.active=r.active==='true'||r.active===true;return r;}
  ['miktar','hammaddeMiktar','ciktiMiktar','kritikSeviye','maksimum'].forEach(f=>{if(r[f]!==undefined)r[f]=parseFloat(r[f])||0;});
  return r;
}
async function syncAll(){
  setSS('loading');
  try{for(const s of SHEETS){C[s]=(await apiRead(s)).map(r=>parseRow(s,r));}setSS('ok');updateBadges();return true;}
  catch(e){setSS('err');toast('Bağlantı hatası: '+e.message,'err');return false;}
}
async function save(sheet){await apiWrite(sheet,C[sheet]);}

function scheduleClone(v){return JSON.parse(JSON.stringify(v));}
function scheduleJSON(v,fallback={}){try{return JSON.parse(v||'')||fallback;}catch{return fallback;}}
function scheduleIsMeta(r){return r.baslik===S_META;}
function scheduleIsPerson(r){return r.baslik===S_PERSON;}
function scheduleTaskMeta(r){const m=scheduleJSON(r.aciklama,null);return m&&m.type===S_TASK?m:null;}
function scheduleIsTask(r){return !!scheduleTaskMeta(r);}
function scheduleIsRow(r){return scheduleIsMeta(r)||scheduleIsPerson(r)||scheduleIsTask(r);}
function scheduleCellKey(pName,dIdx){return pName+'-'+dIdx;}
function scheduleBaseRow(extra){
  const u=currentUser?.username||'system',now=today();
  return {id:uid(),baslik:'',kategori:'Diğer',atanan:'',atayan:u,tarih:now,basTarih:now,bitisTarih:'',oncelik:'Normal',durum:'Bekliyor',aciklama:'',kullanici:u,...extra};
}
function scheduleDefaultRows(){
  const rows=[scheduleBaseRow({baslik:S_META,durum:'Aktif',aciklama:JSON.stringify({title:GOREV_CIZELGE.title,subtitle:GOREV_CIZELGE.subtitle,days:GOREV_CIZELGE.days})})];
  GOREV_CIZELGE.persons.forEach(p=>rows.push(scheduleBaseRow({baslik:S_PERSON,atanan:p.name,durum:'Aktif',aciklama:JSON.stringify({type:S_PERSON,role:p.role||''})})));
  Object.entries(GOREV_CIZELGE.tasks).forEach(([cell,tasks])=>{
    const cut=cell.lastIndexOf('-'),atanan=cell.slice(0,cut),dayIndex=parseInt(cell.slice(cut+1),10);
    tasks.forEach(task=>rows.push(scheduleBaseRow({baslik:task.t,atanan,tarih:S_DATES[dayIndex]||'',basTarih:S_DATES[dayIndex]||'',oncelik:S_PRIO_TO_ON[task.p]||'Normal',aciklama:JSON.stringify({type:S_TASK,dayIndex,priority:task.p||'teal'})})));
  });
  return rows;
}
async function ensureScheduleOnline(){
  if(C.Gorevler.some(scheduleIsRow))return;
  C.Gorevler.push(...scheduleDefaultRows());
  await save('Gorevler');
}
function scheduleMetaRow(){
  let r=C.Gorevler.find(scheduleIsMeta);
  if(!r){r=scheduleDefaultRows()[0];C.Gorevler.push(r);}
  return r;
}
function scheduleMeta(){
  const m=scheduleJSON(scheduleMetaRow().aciklama,{});
  return {title:m.title||GOREV_CIZELGE.title,subtitle:m.subtitle||GOREV_CIZELGE.subtitle,days:Array.isArray(m.days)&&m.days.length?m.days:GOREV_CIZELGE.days};
}
function scheduleData(){
  const meta=scheduleMeta(),persons=[],seen=new Set(),tasks={},done={};
  C.Gorevler.filter(scheduleIsPerson).forEach(r=>{
    const name=(r.atanan||'').trim();if(!name||seen.has(name))return;
    seen.add(name);persons.push({name,role:scheduleJSON(r.aciklama,{}).role||''});
  });
  C.Gorevler.forEach(r=>{
    const m=scheduleTaskMeta(r);if(!m)return;
    const name=(r.atanan||'').trim()||'Genel';
    if(!seen.has(name)){seen.add(name);persons.push({name,role:m.role||''});}
    const idx=Math.max(0,parseInt(m.dayIndex,10)||0),ck=scheduleCellKey(name,idx);
    if(!tasks[ck])tasks[ck]=[];
    const priority=m.priority||S_ON_TO_PRIO[r.oncelik]||'teal';
    const item={id:r.id,t:r.baslik||'Görev',p:['red','amber','teal','blue'].includes(priority)?priority:'teal',done:r.durum==='Tamamlandı'};
    tasks[ck].push(item);if(item.done)done[item.id]=true;
  });
  if(!persons.length)GOREV_CIZELGE.persons.forEach(p=>persons.push({...p}));
  return {...meta,persons,tasks,done};
}
async function scheduleSaveAndRefresh(message='Çizelge güncellendi ✓'){

  try{
    await save('Gorevler');scheduleSelected=new Set([...scheduleSelected].filter(id=>C.Gorevler.some(r=>r.id===id)));

  }catch(e){loading(false);toast('Çizelge kaydedilemedi: '+e.message,'err');}
}

function scheduleCanEdit(){return canDelete();}
function scheduleGuard(){if(scheduleCanEdit())return true;toast('Çizelgeyi yalnızca admin düzenleyebilir.','err');return false;}
function scheduleHTML(compact=false){
  const D=scheduleData();
  const total=Object.values(D.tasks).reduce((n,arr)=>n+arr.length,0);
  const done=Object.values(D.tasks).flat().filter(t=>t.done).length;
  const editable=scheduleCanEdit();
  const titleEdit=editable?`contenteditable="true" onblur="scheduleEditMeta('title',this.textContent)"`:'';
  const subEdit=editable?`contenteditable="true" onblur="scheduleEditMeta('subtitle',this.textContent)"`:'';
  if(!editable&&scheduleSelectMode){scheduleSelectMode=false;scheduleSelected.clear();}
  return`

async function scheduleEditMeta(field,value){if(!scheduleGuard())return;const r=scheduleMetaRow(),m=scheduleMeta();m[field]=value.trim()||GOREV_CIZELGE[field];r.aciklama=JSON.stringify(m);await scheduleSaveAndRefresh('Başlık güncellendi ✓');}
async function scheduleAddTask(personIdx,dayIndex){
  if(!scheduleGuard())return;
  const D=scheduleData(),pObj=D.persons[personIdx];if(!pObj)return;
  const t=prompt('Görev açıklaması');if(!t)return;
  const p=prompt('Öncelik: red, amber, teal, blue','teal')||'teal';
  const priority=['red','amber','teal','blue'].includes(p)?p:'teal',date=S_DATES[dayIndex]||'';
  C.Gorevler.push(scheduleBaseRow({baslik:t.trim(),atanan:pObj.name,tarih:date,basTarih:date,oncelik:S_PRIO_TO_ON[priority]||'Normal',aciklama:JSON.stringify({type:S_TASK,dayIndex,priority,role:pObj.role||''})}));
  await scheduleSaveAndRefresh();
}
async function scheduleRemoveTask(id){if(!scheduleGuard()||!confirm('Bu görev silinsin mi?'))return;C.Gorevler=C.Gorevler.filter(r=>r.id!==id);scheduleSelected.delete(id);await scheduleSaveAndRefresh('Görev silindi.');}
async function scheduleToggleDone(id){if(!scheduleGuard())return;const r=C.Gorevler.find(x=>x.id===id);if(!r)return;r.durum=r.durum==='Tamamlandı'?'Bekliyor':'Tamamlandı';await scheduleSaveAndRefresh('');}
async function scheduleCyclePriority(id){if(!scheduleGuard())return;const r=C.Gorevler.find(x=>x.id===id);if(!r)return;const m=scheduleTaskMeta(r)||{},order=['red','amber','teal','blue'];m.priority=order[(order.indexOf(m.priority||S_ON_TO_PRIO[r.oncelik]||'teal')+1)%order.length];r.oncelik=S_PRIO_TO_ON[m.priority]||'Normal';r.aciklama=JSON.stringify({...m,type:S_TASK});await scheduleSaveAndRefresh('');}
async function scheduleAddPerson(){if(!scheduleGuard())return;const name=prompt('Kişi adı');if(!name)return;const role=prompt('Rol','')||'';C.Gorevler.push(scheduleBaseRow({baslik:S_PERSON,atanan:name.trim(),durum:'Aktif',aciklama:JSON.stringify({type:S_PERSON,role:role.trim()})}));await scheduleSaveAndRefresh('Kişi eklendi ✓');}
async function scheduleEditPerson(idx){
  if(!scheduleGuard())return;
  const D=scheduleData(),old=D.persons[idx];if(!old)return;
  const name=prompt('Kişi adı',old.name);if(!name)return;const role=prompt('Rol',old.role||'')||'',n=name.trim();
  C.Gorevler.forEach(r=>{
    if(r.atanan===old.name){
      r.atanan=n;
      const m=scheduleJSON(r.aciklama,{});
      if(scheduleIsPerson(r)||m.type===S_TASK)r.aciklama=JSON.stringify({...m,role:role.trim()});
    }
  });
  await scheduleSaveAndRefresh('Kişi güncellendi ✓');
}
async function scheduleRemovePerson(idx){if(!scheduleGuard())return;const D=scheduleData(),p=D.persons[idx];if(!p||!confirm('Bu kişi ve görevleri silinsin mi?'))return;C.Gorevler=C.Gorevler.filter(r=>!(r.atanan===p.name&&(scheduleIsPerson(r)||scheduleIsTask(r))));await scheduleSaveAndRefresh('Kişi ve görevleri silindi.');}
async function scheduleAddDay(){if(!scheduleGuard())return;const day=prompt('Gün adı');if(!day)return;const r=scheduleMetaRow(),m=scheduleMeta();m.days.push(day.trim());r.aciklama=JSON.stringify(m);await scheduleSaveAndRefresh('Gün eklendi ✓');}
async function scheduleRemoveDay(idx){
  if(!scheduleGuard())return;
  if(!confirm('Bu gün ve içindeki görevler silinsin mi?'))return;
  const r=scheduleMetaRow(),m=scheduleMeta();m.days.splice(idx,1);r.aciklama=JSON.stringify(m);
  C.Gorevler=C.Gorevler.filter(row=>{
    const tm=scheduleTaskMeta(row);if(!tm)return true;
    const di=parseInt(tm.dayIndex,10)||0;if(di===idx)return false;
    if(di>idx){tm.dayIndex=di-1;row.aciklama=JSON.stringify(tm);}
    return true;
  });
  await scheduleSaveAndRefresh('Gün silindi.');
}
function scheduleToggleSelect(id){if(!scheduleGuard())return;scheduleSelected.has(id)?scheduleSelected.delete(id):scheduleSelected.add(id);scheduleRefresh();}
async function scheduleDeleteSelected(){if(!scheduleGuard()||scheduleSelected.size===0)return;if(!confirm(`${scheduleSelected.size} görev silinsin mi?`))return;C.Gorevler=C.Gorevler.filter(r=>!scheduleSelected.has(r.id));scheduleSelected.clear();await scheduleSaveAndRefresh('Seçili görevler silindi.');}
async function scheduleClearTasks(){if(!scheduleGuard()||!confirm('Tüm çizelge görevleri silinsin mi? Kişiler ve günler kalır.'))return;C.Gorevler=C.Gorevler.filter(r=>!scheduleIsTask(r));scheduleSelected.clear();await scheduleSaveAndRefresh('Tüm çizelge görevleri silindi.');}
async function scheduleClearPeopleAndTasks(){if(!scheduleGuard()||!confirm('Tüm kişiler ve tüm çizelge görevleri silinsin mi?'))return;C.Gorevler=C.Gorevler.filter(r=>!(scheduleIsPerson(r)||scheduleIsTask(r)));scheduleSelected.clear();await scheduleSaveAndRefresh('Kişiler ve görevler temizlendi.');}
async function scheduleResetWeek(){if(!scheduleGuard()||!confirm('Çizelge varsayılan haftalık içerikle sıfırlansın mı?'))return;C.Gorevler=C.Gorevler.filter(r=>!scheduleIsRow(r));C.Gorevler.push(...scheduleDefaultRows());scheduleSelected.clear();scheduleSelectMode=false;await scheduleSaveAndRefresh('Haftalık çizelge sıfırlandı ✓');}

function stokYeni(){showModal('Yeni Stok Kalemi',sForm(),`<button class="btn btn-ghost" onclick="closeModalDirect()">İptal</button><button class="btn btn-primary" onclick="stokKaydet()">Kaydet</button>`);}

function stokDuzenle(id){const s=C.Stok.find(x=>x.id===id);if(!s)return;showModal('Stok Düzenle',sForm(s),`<button class="btn btn-ghost" onclick="closeModalDirect()">İptal</button><button class="btn btn-primary" onclick="stokGuncelle('${id}')">Güncelle</button>`);}
async function stokGuncelle(id){const v=sVal();if(!v)return;const idx=C.Stok.findIndex(x=>x.id===id);C.Stok[idx]={...C.Stok[idx],...v};closeModalDirect();loading(true,'Güncelleniyor...');try{await save('Stok');loading(false);toast('Güncellendi ✓');updateBadges();renderStok('','','');}catch(e){loading(false);toast('Hata: '+e.message,'err');}}
async function stokSil(id){if(!confirm('Emin misiniz?'))return;C.Stok=C.Stok.filter(x=>x.id!==id);loading(true);try{await save('Stok');loading(false);toast('Silindi.','err');updateBadges();renderStok('','','');}catch(e){loading(false);toast('Hata: '+e.message,'err');}}

// ── ÇIKTI ──
let cAra='';
function cikti(){document.getElementById('topbar-actions').innerHTML=`<button class="btn btn-primary btn-sm" onclick="ciktiYeni()">+ Yeni Çıktı</button>`;cAra='';renderCikti('');}
function renderCikti(ara=cAra){
  cAra=ara;
  let rows=[...C.Cikti];if(ara)rows=rows.filter(c=>(c.ad||'').toLowerCase().includes(ara.toLowerCase())||(c.batchId||'').toLowerCase().includes(ara.toLowerCase())||(c.hammadde||'').toLowerCase().includes(ara.toLowerCase()));
  rows.sort((a,b)=>new Date(b.tarih||0)-new Date(a.tarih||0));
  document.getElementById('content').innerHTML=`
    <div class="flex gap-12 mb-16"><div class="search-bar" style="flex:1"><span class="search-icon">⌕</span><input type="text" placeholder="Ürün, batch veya hammadde ara..." value="${esc(ara)}" id="c-ara-inp" style="width:100%"></div></div>
    ${rows.length===0?`<div class="empty-state"><div class="empty-icon">↑</div><div>Çıktı kaydı yok</div></div>`:
    `<div class="table-wrap"><table><thead><tr><th>Batch ID</th><th>Ürün</th><th>Hammadde</th><th>Hmm. Mik.</th><th>Çıktı Mik.</th><th>Verim %</th><th>Tarih</th><th>Operatör</th><th>İşlem</th></tr></thead><tbody>${rows.map(c=>{
      const v=c.hammaddeMiktar>0?(c.ciktiMiktar/c.hammaddeMiktar*100).toFixed(1):'—';
      return`<tr><td class="text-mono" style="font-size:11px">${esc(c.batchId||'—')}</td><td class="td-main">${esc(c.ad||'—')}</td><td>${esc(c.hammadde||'—')}</td><td class="text-mono">${esc(c.hammaddeMiktar||'—')} ${esc(c.hammaddeBirim||'')}</td><td class="text-mono">${esc(c.ciktiMiktar||'—')} ${esc(c.ciktiBirim||'')}</td><td class="text-mono ${parseFloat(v)>0?'stat-green':''}">${v}${v!=='—'?'%':''}</td><td class="text-mono" style="font-size:11px">${fmt(c.tarih)}</td><td>${esc(c.operator||'—')}</td><td style="white-space:nowrap"><button class="btn btn-ghost btn-sm" onclick="ciktiDuzenle('${c.id}')">Düzenle</button>${canDelete()?`<button class="btn btn-danger btn-sm" onclick="ciktiSil('${c.id}')">Sil</button>`:''}</td></tr>`;
    }).join('')}</tbody></table></div>`}`;
  const inp=document.getElementById('c-ara-inp');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);inp.oninput=function(){renderCikti(this.value);};}
}
function cForm(c={}){
  const stokOpts=C.Stok.map(s=>`<option value="${s.ad}" data-miktar="${s.miktar}" data-birim="${s.birim||''}">${s.ad} (${s.miktar} ${s.birim||''}) [${s.lab||''}]</option>`).join('');
  return`
  <div class="form-row"><div class="form-group"><label>Batch ID *</label><input type="text" id="c-batch" value="${c.batchId||'BATCH-'}"></div>
  <div class="form-group"><label>Ürün Adı *</label><input type="text" id="c-ad" value="${c.ad||''}" placeholder="ör: Piperine Ekstrakt"></div></div>
  <div class="form-group"><label>Hammadde (Stoktan Seç)</label>
    <select id="c-hmm" onchange="ciktiHammaddeSecildi(this)"><option value="">— Seçiniz —</option>${stokOpts}</select>
    <div id="stok-bilgi" style="margin-top:6px;font-size:12px;color:var(--green);font-family:var(--mono);display:none"></div>
  </div>
  <div class="form-row"><div class="form-group"><label>Hammadde Miktarı (Düşülecek)</label><input type="number" id="c-hmmm" value="${c.hammaddeMiktar||''}" step="any" min="0" oninput="ciktiMiktarGuncelle()"></div>
  <div class="form-group"><label>Hammadde Birimi</label><select id="c-hb">${['g','kg','mL','L','adet'].map(b=>`<option ${c.hammaddeBirim===b?'selected':''}>${b}</option>`).join('')}</select></div></div>
  <div id="stok-uyari" style="display:none" class="alert alert-red mb-8"></div>
  <div class="form-row"><div class="form-group"><label>Çıktı Miktarı</label><input type="number" id="c-cm" value="${c.ciktiMiktar||''}" step="any" min="0"></div>
  <div class="form-group"><label>Çıktı Birimi</label><select id="c-cb">${['g','kg','mL','L','adet'].map(b=>`<option ${c.ciktiBirim===b?'selected':''}>${b}</option>`).join('')}</select></div></div>
  <div class="form-row"><div class="form-group"><label>Tarih *</label><input type="date" id="c-tarih" value="${c.tarih?c.tarih.slice(0,10):new Date().toISOString().slice(0,10)}"></div>
  <div class="form-group"><label>Operatör</label><input type="text" id="c-op" value="${c.operator||currentUser.username}"></div></div>
  <div class="form-row"><div class="form-group"><label>Proses Koşulları</label><input type="text" id="c-kos" value="${c.kosullar||''}" placeholder="ör: 40°C, 200 bar"></div></div>
  <div class="form-group"><label>Not</label><textarea id="c-not">${c.not||''}</textarea></div>`;}
function ciktiHammaddeSecildi(sel){
  const opt=sel.options[sel.selectedIndex];const miktar=opt.getAttribute('data-miktar');const birim=opt.getAttribute('data-birim');
  const bilgi=document.getElementById('stok-bilgi');
  if(sel.value&&miktar){bilgi.textContent=`Mevcut stok: ${miktar} ${birim}`;bilgi.style.display='block';}
  else bilgi.style.display='none';
  ciktiMiktarGuncelle();
}
function ciktiMiktarGuncelle(){
  const sel=document.getElementById('c-hmm');const opt=sel.options[sel.selectedIndex];
  const mevcutMiktar=parseFloat(opt.getAttribute('data-miktar'))||0;
  const istenen=parseFloat(document.getElementById('c-hmmm').value)||0;
  const uyari=document.getElementById('stok-uyari');
  if(sel.value&&istenen>mevcutMiktar){uyari.textContent=`⚠ Girilen miktar (${istenen}) stokta mevcut miktardan (${mevcutMiktar}) fazla!`;uyari.style.display='block';}
  else uyari.style.display='none';
}
function ciktiYeni(){showModal('Yeni Çıktı',cForm(),`<button class="btn btn-ghost" onclick="closeModalDirect()">İptal</button><button class="btn btn-primary" onclick="ciktiKaydet()">Kaydet</button>`);}
async function ciktiKaydet(){
  const ad=document.getElementById('c-ad').value.trim();const tarih=document.getElementById('c-tarih').value;if(!ad||!tarih){toast('Ürün adı ve tarih zorunlu.','err');return;}
  const hmm=parseFloat(document.getElementById('c-hmmm').value)||0;const hammadde=document.getElementById('c-hmm').value;
  if(hammadde&&hmm>0){
    const s=C.Stok.find(x=>x.ad===hammadde);
    if(s&&hmm>parseFloat(s.miktar)){if(!confirm(`Stokta ${s.miktar} ${s.birim||''} var, ${hmm} düşmek istiyorsunuz. Devam edilsin mi?`))return;}
  }
  const k={id:uid(),batchId:document.getElementById('c-batch').value.trim(),ad,hammadde,hammaddeMiktar:hmm,hammaddeBirim:document.getElementById('c-hb').value,ciktiMiktar:parseFloat(document.getElementById('c-cm').value)||0,ciktiBirim:document.getElementById('c-cb').value,tarih,operator:document.getElementById('c-op').value,kosullar:document.getElementById('c-kos').value,not:document.getElementById('c-not').value,kullanici:currentUser.username};
  C.Cikti.push(k);
  if(hammadde&&hmm>0){const s=C.Stok.find(x=>x.ad===hammadde);if(s){s.miktar=Math.max(0,parseFloat(s.miktar||0)-hmm);s.sonGuncelleme=new Date().toISOString();}}
  closeModalDirect();loading(true,'Kaydediliyor...');try{await save('Cikti');await save('Stok');loading(false);toast('Çıktı kaydedildi ✓');updateBadges();renderCikti('');}catch(e){loading(false);toast('Hata: '+e.message,'err');}
}
function ciktiDuzenle(id){const c=C.Cikti.find(x=>x.id===id);if(!c)return;showModal('Çıktı Düzenle',cForm(c),`<button class="btn btn-ghost" onclick="closeModalDirect()">İptal</button><button class="btn btn-primary" onclick="ciktiGuncelle('${id}')">Güncelle</button>`);}
async function ciktiGuncelle(id){
  const ad=document.getElementById('c-ad').value.trim();const tarih=document.getElementById('c-tarih').value;if(!ad||!tarih){toast('Zorunlu alan eksik.','err');return;}
  const idx=C.Cikti.findIndex(x=>x.id===id);C.Cikti[idx]={...C.Cikti[idx],batchId:document.getElementById('c-batch').value.trim(),ad,hammadde:document.getElementById('c-hmm').value,hammaddeMiktar:parseFloat(document.getElementById('c-hmmm').value)||0,hammaddeBirim:document.getElementById('c-hb').value,ciktiMiktar:parseFloat(document.getElementById('c-cm').value)||0,ciktiBirim:document.getElementById('c-cb').value,tarih,operator:document.getElementById('c-op').value,kosullar:document.getElementById('c-kos').value,not:document.getElementById('c-not').value};
  closeModalDirect();loading(true,'Güncelleniyor...');try{await save('Cikti');loading(false);toast('Güncellendi ✓');renderCikti('');}catch(e){loading(false);toast('Hata: '+e.message,'err');}
}
async function ciktiSil(id){if(!confirm('Emin misiniz?'))return;C.Cikti=C.Cikti.filter(x=>x.id!==id);loading(true);try{await save('Cikti');loading(false);toast('Silindi.','err');renderCikti('');}catch(e){loading(false);toast('Hata: '+e.message,'err');}}

// ── ANALİZ ──
function analiz(){document.getElementById('topbar-actions').innerHTML=`<button class="btn btn-primary btn-sm" onclick="analizYeni()">+ Yeni Analiz</button>`;renderAnaliz('');}
function renderAnaliz(ara){
  let rows=[...C.Analiz];if(ara)rows=rows.filter(a=>(a.numune||'').toLowerCase().includes(ara.toLowerCase())||(a.tur||'').toLowerCase().includes(ara.toLowerCase()));
  rows.sort((a,b)=>new Date(b.tarih||0)-new Date(a.tarih||0));
  document.getElementById('content').innerHTML=`
    <div class="flex gap-12 mb-16"><div class="search-bar" style="flex:1"><span class="search-icon">⌕</span><input type="text" placeholder="Ara..." value="${ara}" id="a-ara-inp" style="width:100%"></div></div>
    ${rows.length===0?`<div class="empty-state"><div class="empty-icon">⌬</div><div>Analiz kaydı yok</div></div>`:
    `<div class="table-wrap"><table><thead><tr><th>Numune ID</th><th>Numune</th><th>Tür</th><th>Yöntem</th><th>Sonuç</th><th>Tarih</th><th>Analist</th><th>İşlem</th></tr></thead><tbody>${rows.map(a=>`<tr>
      <td class="text-mono" style="font-size:11px">${a.numuneId||'—'}</td><td class="td-main">${a.numune||'—'}</td>
      <td><span class="badge badge-blue">${a.tur||'—'}</span></td><td>${a.yontem||'—'}</td>
      <td class="text-mono stat-green">${a.sonuc||'—'} ${a.birim||''}</td><td class="text-mono" style="font-size:11px">${fmt(a.tarih)}</td><td>${a.analist||'—'}</td>
      <td style="white-space:nowrap"><button class="btn btn-ghost btn-sm" onclick="analizDetay('${a.id}')">Detay</button><button class="btn btn-ghost btn-sm" onclick="analizDuzenle('${a.id}')">Düzenle</button>${canDelete()?`<button class="btn btn-danger btn-sm" onclick="analizSil('${a.id}')">Sil</button>`:''}</td>
    </tr>`).join('')}</tbody></table></div>`}`;
}
function aForm(a={}){return`
  <div class="form-row"><div class="form-group"><label>Numune ID</label><input type="text" id="a-nid" value="${a.numuneId||''}" placeholder="NUM-001"></div>
  <div class="form-group"><label>Numune Adı *</label><input type="text" id="a-numune" value="${a.numune||''}"></div></div>
  <div class="form-row"><div class="form-group"><label>Analiz Türü</label><select id="a-tur">${['HPLC','GC-MS','ICP-OES','UV-Vis','IC','TOC','CUPRAC','Titrasyon','Diğer'].map(t=>`<option ${a.tur===t?'selected':''}>${t}</option>`).join('')}</select></div>
  <div class="form-group"><label>Cihaz / Yöntem</label><input type="text" id="a-yontem" value="${a.yontem||''}" placeholder="ör: HPLC-C18"></div></div>
  <div class="form-row"><div class="form-group"><label>Sonuç</label><input type="text" id="a-sonuc" value="${a.sonuc||''}"></div>
  <div class="form-group"><label>Birim</label><input type="text" id="a-birim" value="${a.birim||''}" placeholder="% veya mg/g"></div></div>
  <div class="form-row"><div class="form-group"><label>Tarih *</label><input type="date" id="a-tarih" value="${a.tarih?a.tarih.slice(0,10):new Date().toISOString().slice(0,10)}"></div>
  <div class="form-group"><label>Analist</label><input type="text" id="a-analist" value="${a.analist||currentUser.username}"></div></div>
  <div class="form-group"><label>Batch ID</label><input type="text" id="a-batch" value="${a.batchId||''}"></div>
  <div class="form-group"><label>Not</label><textarea id="a-not">${a.not||''}</textarea></div>`;}
function analizYeni(){showModal('Yeni Analiz',aForm(),`<button class="btn btn-ghost" onclick="closeModalDirect()">İptal</button><button class="btn btn-primary" onclick="analizKaydet()">Kaydet</button>`);}
async function analizKaydet(){
  const numune=document.getElementById('a-numune').value.trim();const tarih=document.getElementById('a-tarih').value;if(!numune||!tarih){toast('Numune ve tarih zorunlu.','err');return;}
  C.Analiz.push({id:uid(),numuneId:document.getElementById('a-nid').value,numune,tur:document.getElementById('a-tur').value,yontem:document.getElementById('a-yontem').value,sonuc:document.getElementById('a-sonuc').value,birim:document.getElementById('a-birim').value,tarih,analist:document.getElementById('a-analist').value,batchId:document.getElementById('a-batch').value,not:document.getElementById('a-not').value,kullanici:currentUser.username});
  closeModalDirect();loading(true,'Kaydediliyor...');try{await save('Analiz');loading(false);toast('Analiz kaydedildi ✓');renderAnaliz('');}catch(e){loading(false);toast('Hata: '+e.message,'err');}
}
function analizDetay(id){const a=C.Analiz.find(x=>x.id===id);if(!a)return;showModal('Analiz Detayı',`<table style="width:100%;font-size:13px;border-collapse:collapse">${[['Numune ID',a.numuneId],['Numune Adı',a.numune],['Tür',a.tur],['Yöntem',a.yontem],['Sonuç',`${a.sonuc||'—'} ${a.birim||''}`],['Tarih',fmt(a.tarih)],['Analist',a.analist],['Batch ID',a.batchId],['Kaydeden',a.kullanici],['Not',a.not]].map(([k,v])=>`<tr style="border-bottom:1px solid var(--border)"><td style="padding:8px 0;color:var(--text3);width:140px;font-family:var(--mono);font-size:11px">${k}</td><td style="padding:8px 0;color:var(--text)">${v||'—'}</td></tr>`).join('')}</table>`,`<button class="btn btn-primary" onclick="closeModalDirect()">Kapat</button>`);}
function analizDuzenle(id){const a=C.Analiz.find(x=>x.id===id);if(!a)return;showModal('Analiz Düzenle',aForm(a),`<button class="btn btn-ghost" onclick="closeModalDirect()">İptal</button><button class="btn btn-primary" onclick="analizGuncelle('${id}')">Güncelle</button>`);}
async function analizGuncelle(id){
  const numune=document.getElementById('a-numune').value.trim();const tarih=document.getElementById('a-tarih').value;if(!numune||!tarih){toast('Zorunlu alan eksik.','err');return;}
  const idx=C.Analiz.findIndex(x=>x.id===id);C.Analiz[idx]={...C.Analiz[idx],numuneId:document.getElementById('a-nid').value,numune,tur:document.getElementById('a-tur').value,yontem:document.getElementById('a-yontem').value,sonuc:document.getElementById('a-sonuc').value,birim:document.getElementById('a-birim').value,tarih,analist:document.getElementById('a-analist').value,batchId:document.getElementById('a-batch').value,not:document.getElementById('a-not').value};
  closeModalDirect();loading(true,'Güncelleniyor...');try{await save('Analiz');loading(false);toast('Güncellendi ✓');renderAnaliz('');}catch(e){loading(false);toast('Hata: '+e.message,'err');}
}
async function analizSil(id){if(!confirm('Emin misiniz?'))return;C.Analiz=C.Analiz.filter(x=>x.id!==id);loading(true);try{await save('Analiz');loading(false);toast('Silindi.','err');renderAnaliz('');}catch(e){loading(false);toast('Hata: '+e.message,'err');}}

// ── EKİPMAN ──
function ekipman(){document.getElementById('topbar-actions').innerHTML=`<button class="btn btn-primary btn-sm" onclick="ekipmanYeni()">+ Yeni Ekipman</button>`;renderEkipman('',0);}
function renderEkipman(ara,tab){
  let rows=[...C.Ekipman];if(ara)rows=rows.filter(e=>(e.ad||'').toLowerCase().includes(ara.toLowerCase()));
  rows.sort((a,b)=>a.ad.localeCompare(b.ad,'tr'));const bugun=new Date();
  document.getElementById('content').innerHTML=`
    <div class="flex gap-12 mb-16"><div class="search-bar" style="flex:1"><span class="search-icon">⌕</span><input type="text" placeholder="Ekipman ara..." value="${ara}" oninput="renderEkipman(this.value,${tab})" style="width:100%"></div></div>
    <div class="tabs">
      <div class="tab ${tab===0?'active':''}" onclick="renderEkipman('${ara}',0)">Ekipman Listesi</div>
      <div class="tab ${tab===1?'active':''}" onclick="renderEkipman('${ara}',1)">Kalibrasyon Tarihçesi</div>
    </div>
    ${tab===0?`
    ${rows.length===0?`<div class="empty-state"><div class="empty-icon">⚙</div><div>Ekipman kaydı yok</div></div>`:
    `<div class="table-wrap"><table><thead><tr><th>Ekipman</th><th>Model</th><th>Lab</th><th>Frekans</th><th>Sonraki Kalib.</th><th>Son Bakım</th><th>Sorumlu</th><th>Durum</th><th>İşlem</th></tr></thead><tbody>${rows.map(e=>{
      const kd=e.kalibrasyonTarihi?new Date(e.kalibrasyonTarihi):null;const diff=kd?(kd-bugun)/86400000:null;
      let kb='<span class="badge badge-gray">Belirtilmedi</span>';if(kd){if(diff<0)kb=`<span class="badge badge-red">Geçmiş</span>`;else if(diff<=30)kb=`<span class="badge badge-amber">${Math.round(diff)} gün</span>`;else kb=`<span class="badge badge-green">${fmt(e.kalibrasyonTarihi)}</span>`;}
      return`<tr><td class="td-main">${e.ad}</td><td class="text-mono" style="font-size:11px">${e.model||'—'}</td><td><span class="badge badge-teal">${e.lab||'—'}</span></td><td><span class="badge badge-purple">${e.kalibrasyonFrekans||'—'}</span></td><td>${kb}</td><td class="text-mono" style="font-size:11px">${fmt(e.bakimTarihi)}</td><td>${e.sorumlu||'—'}</td><td><span class="badge ${e.durum==='Aktif'?'badge-green':e.durum==='Arızalı'?'badge-red':'badge-amber'}">${e.durum||'Aktif'}</span></td><td style="white-space:nowrap">
        <button class="btn btn-success btn-sm" onclick="kalibYapildi('${e.id}')">✓ Kalib. Yapıldı</button>
        <button class="btn btn-ghost btn-sm" onclick="ekipmanDuzenle('${e.id}')">Düzenle</button>
        ${canDelete()?`<button class="btn btn-danger btn-sm" onclick="ekipmanSil('${e.id}')">Sil</button>`:''}
      </td></tr>`;
    }).join('')}</tbody></table></div>`}`:`
    <div class="table-wrap"><table><thead><tr><th>Ekipman</th><th>Tarih</th><th>Yapan</th><th>Not</th><th>Kaydeden</th>${currentUser.role==='admin'?'<th>İşlem</th>':''}</tr></thead><tbody>
    ${C.KalibTarihce.length===0?`<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--text3)">Henüz kalibrasyon kaydı yok</td></tr>`:
    C.KalibTarihce.sort((a,b)=>new Date(b.tarih||0)-new Date(a.tarih||0)).map(k=>`<tr>
      <td class="td-main">${k.ekipmanAd||'—'}</td>
      <td class="text-mono" style="font-size:11px">${fmt(k.tarih)}</td>
      <td>${k.yapan||'—'}</td>
      <td>${k.not||'—'}</td>
      <td>${k.kullanici||'—'}</td>
      ${currentUser.role==='admin'?`<td><button class="btn btn-danger btn-sm" onclick="kalibSil('${k.id}')">Sil</button></td>`:''}
    </tr>`).join('')}
    </tbody></table></div>`}`;
}
function kalibYapildi(ekipmanId){
  const e=C.Ekipman.find(x=>x.id===ekipmanId);if(!e)return;
  showModal('Kalibrasyon Kaydı',`
    <p style="color:var(--text2);margin-bottom:16px;font-size:13px">Ekipman: <strong style="color:var(--text)">${e.ad}</strong></p>
    <div class="form-group"><label>Kalibrasyon Tarihi *</label><input type="date" id="k-tarih" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="form-group"><label>Yapan Kişi</label><input type="text" id="k-yapan" value="${currentUser.username}"></div>
    <div class="form-group"><label>Sonraki Kalibrasyon Tarihi</label><input type="date" id="k-sonraki"></div>
    <div class="form-group"><label>Not</label><textarea id="k-not" style="min-height:60px"></textarea></div>`,
    `<button class="btn btn-ghost" onclick="closeModalDirect()">İptal</button><button class="btn btn-success" onclick="kalibKaydet('${ekipmanId}')">Kaydet</button>`);
}

function temizlik(){document.getElementById('topbar-actions').innerHTML=`<button class="btn btn-primary btn-sm" onclick="temizlikYeni()">+ Yeni Görev</button>`;renderTemizlik('');}
function sonrakiHesapla(sonYapilma,periyot){
  if(!sonYapilma)return'';
  const d=new Date(sonYapilma);
  if(periyot==='Haftalık')d.setDate(d.getDate()+7);
  else if(periyot==='2 Haftalık')d.setDate(d.getDate()+14);
  else if(periyot==='Aylık')d.setMonth(d.getMonth()+1);
  return d.toISOString().slice(0,10);
}
function renderTemizlik(labF){
  const bugun=new Date();
  let rows=[...C.Temizlik];
  if(labF)rows=rows.filter(t=>t.lab===labF);
  rows.sort((a,b)=>(a.sonrakiTarih||'').localeCompare(b.sonrakiTarih||''));
  document.getElementById('content').innerHTML=`
    <div class="filter-bar mb-16">
      <button class="filter-btn ${!labF?'active':''}" onclick="renderTemizlik('')">Tümü</button>
      ${LABS.map(l=>`<button class="filter-btn ${labF===l?'active':''}" onclick="renderTemizlik('${l}')">${l}</button>`).join('')}
    </div>
    ${rows.length===0?`<div class="empty-state"><div class="empty-icon">✦</div><div>Temizlik görevi yok. + Yeni Görev ile ekleyin.</div></div>`:
    `<div class="table-wrap"><table><thead><tr><th>Görev</th><th>Lab</th><th>Sorumlu</th><th>Periyot</th><th>Son Yapılma</th><th>Sonraki</th><th>Durum</th><th>İşlem</th></tr></thead><tbody>${rows.map(t=>{
      const gecmis=t.sonrakiTarih&&new Date(t.sonrakiTarih)<bugun;
      const yakin=t.sonrakiTarih&&(new Date(t.sonrakiTarih)-bugun)/86400000<=3&&!gecmis;
      let ds=t.durum==='Tamamlandı'?'<span class="badge badge-green">Tamamlandı</span>':gecmis?'<span class="badge badge-red">Gecikmiş</span>':yakin?'<span class="badge badge-amber">Yaklaşıyor</span>':'<span class="badge badge-gray">Bekliyor</span>';
      return`<tr>
        <td class="td-main">${t.gorev}</td>
        <td><span class="badge badge-teal">${t.lab||'—'}</span></td>
        <td>${t.sorumlu||'—'}</td>
        <td><span class="badge badge-purple">${t.periyot||'—'}</span></td>
        <td class="text-mono" style="font-size:11px">${fmt(t.sonYapilma)}</td>
        <td class="text-mono ${gecmis?'stat-red':yakin?'stat-amber':''}" style="font-size:11px">${fmt(t.sonrakiTarih)}</td>
        <td>${ds}</td>
        <td style="white-space:nowrap">
          <button class="btn btn-success btn-sm" onclick="temizlikTamamla('${t.id}')">✓ Yapıldı</button>
          <button class="btn btn-ghost btn-sm" onclick="temizlikDuzenle('${t.id}')">Düzenle</button>
          ${canDelete()?`<button class="btn btn-danger btn-sm" onclick="temizlikSil('${t.id}')">Sil</button>`:''}
        </td>
      </tr>`;
    }).join('')}</tbody></table></div>`}`;
}

  <div class="form-row"><div class="form-group"><label>Görev Adı *</label><input type="text" id="t-gorev" value="${t.gorev||''}" placeholder="ör: Tezgah Temizliği"></div>

async function temizlikKaydet(){

}
function temizlikTamamla(id){

async function temizlikTamamlaKaydet(id){

async function temizlikGuncelle(id){
  const gorev=document.getElementById('t-gorev').value.trim();if(!gorev){toast('Görev adı zorunlu.','err');return;}

let calView='schedule',calDate=new Date();
function takvim(){
  document.getElementById('topbar-actions').innerHTML=`
    <button class="btn btn-ghost btn-sm" onclick="calView='schedule';renderCal()">Çizelge</button>
    <button class="btn btn-ghost btn-sm" onclick="calView='monthly';renderCal()">Aylık</button>
    <button class="btn btn-ghost btn-sm" onclick="calView='weekly';renderCal()">Haftalık</button>
    <button class="btn btn-primary btn-sm" onclick="gorevYeni(null)">+ Takvim Görevi</button>`;
  renderCal();
}
function gRenk(kat){const m={'Analiz':'#4f9cf9','Ekstraksiyon/Proses':'#9b59b6','Ekipman Bakımı':'#f5a623','Kalibrasyon':'#1abc9c','Temizlik':'#3ecf8e','Numune Hazırlama':'#4f9cf9','Raporlama':'#8892aa','Tedarik/Satın Alma':'#8892aa','Ar-Ge':'#9b59b6','Toplantı':'#1abc9c','Diğer':'#8892aa'};return m[kat]||'#8892aa';}
function renderCal(){if(calView==='schedule')renderSchedule();else if(calView==='monthly')renderMonthly();else renderWeekly();}
function renderSchedule(){
  document.getElementById('content').innerHTML=scheduleHTML();
}
function renderMonthly(){
  const yr=calDate.getFullYear(),mo=calDate.getMonth();
  const firstDay=new Date(yr,mo,1);const lastDay=new Date(yr,mo+1,0);
  const td=today();let dow=firstDay.getDay();if(dow===0)dow=7;dow--;
  const cells=[];
  for(let i=0;i<dow;i++){const d=new Date(yr,mo,1-dow+i);cells.push({date:d,cur:false});}
  for(let i=1;i<=lastDay.getDate();i++)cells.push({date:new Date(yr,mo,i),cur:true});
  while(cells.length%7!==0){const last=cells[cells.length-1].date;const d=new Date(last);d.setDate(d.getDate()+1);cells.push({date:d,cur:false});}
  document.getElementById('content').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <button class="cal-nav-btn" onclick="calDate=new Date(calDate.getFullYear(),calDate.getMonth()-1,1);renderCal()">← Önceki</button>
      <span style="font-size:16px;font-weight:600">${TR_AY[mo]} ${yr}</span>
      <button class="cal-nav-btn" onclick="calDate=new Date(calDate.getFullYear(),calDate.getMonth()+1,1);renderCal()">Sonraki →</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px">
      ${TR_GUN.map(g=>`<div style="text-align:center;padding:6px;font-size:11px;font-family:var(--mono);color:var(--text3)">${g}</div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">
      ${cells.map(({date,cur})=>{
        const ds=date.toISOString().slice(0,10);
        const tasks=C.Gorevler.filter(g=>!scheduleIsRow(g)&&(g.tarih===ds||g.basTarih===ds));
        return`<div style="min-height:80px;background:var(--bg2);border:1px solid ${ds===td?'var(--accent)':'var(--border)'};border-radius:4px;padding:6px;cursor:pointer;opacity:${cur?1:0.35}" onclick="gorevYeni('${ds}')">
          <div style="font-size:11px;font-family:var(--mono);color:${ds===td?'var(--accent)':'var(--text3)'};font-weight:${ds===td?600:400};margin-bottom:3px">${date.getDate()}</div>
          ${tasks.slice(0,3).map(g=>`<div onclick="event.stopPropagation();gorevDetay('${g.id}')" style="font-size:10px;padding:2px 4px;border-radius:3px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:${gRenk(g.kategori)}22;color:${gRenk(g.kategori)};border-left:2px solid ${gRenk(g.kategori)}">${g.baslik}</div>`).join('')}
          ${tasks.length>3?`<div style="font-size:10px;color:var(--text3)">+${tasks.length-3} daha</div>`:''}
        </div>`;
      }).join('')}
    </div>
    <div style="margin-top:20px">
      <div class="table-wrap"><table><thead><tr><th>Başlık</th><th>Kategori</th><th>Atanan</th><th>Tarih</th><th>Öncelik</th><th>Durum</th><th>İşlem</th></tr></thead>
      <tbody>${C.Gorevler.filter(g=>!scheduleIsRow(g)).sort((a,b)=>new Date(b.tarih||0)-new Date(a.tarih||0)).slice(0,10).map(g=>`<tr>
        <td class="td-main">${g.baslik}</td>
        <td><span class="badge ${KBADGE[g.kategori]||'badge-gray'}">${g.kategori||'—'}</span></td>
        <td>${g.atanan||'—'}</td>
        <td class="text-mono" style="font-size:11px">${fmt(g.tarih||g.basTarih)}</td>
        <td><span class="badge ${ORENK[g.oncelik]||'badge-gray'}">${g.oncelik||'—'}</span></td>
        <td><span class="badge ${g.durum==='Tamamlandı'?'badge-green':g.durum==='Devam Ediyor'?'badge-blue':'badge-gray'}">${g.durum||'—'}</span></td>
        <td style="white-space:nowrap"><button class="btn btn-ghost btn-sm" onclick="gorevDetay('${g.id}')">Detay</button>${canDelete()?`<button class="btn btn-danger btn-sm" onclick="gorevSil('${g.id}')">Sil</button>`:''}</td>
      </tr>`).join('')}</tbody></table></div>
    </div>`;
}
function renderWeekly(){
  const d=new Date(calDate);const dow=d.getDay()||7;d.setDate(d.getDate()-dow+1);
  const weekDays=[];for(let i=0;i<7;i++){const x=new Date(d);x.setDate(d.getDate()+i);weekDays.push(x);}
  const td=today();
  document.getElementById('content').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <button class="cal-nav-btn" onclick="calDate.setDate(calDate.getDate()-7);renderCal()">← Önceki</button>
      <span style="font-size:16px;font-weight:600">${weekDays[0].getDate()} ${TR_AY[weekDays[0].getMonth()]} — ${weekDays[6].getDate()} ${TR_AY[weekDays[6].getMonth()]} ${weekDays[6].getFullYear()}</span>
      <button class="cal-nav-btn" onclick="calDate.setDate(calDate.getDate()+7);renderCal()">Sonraki →</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">
      ${weekDays.map(wd=>{
        const ds=wd.toISOString().slice(0,10);
        const tasks=C.Gorevler.filter(g=>!scheduleIsRow(g)&&(g.tarih===ds||g.basTarih===ds));
        return`<div>
          <div style="text-align:center;padding:8px;background:var(--bg3);border-radius:4px 4px 0 0;border:1px solid ${ds===td?'var(--accent)':'var(--border)'};color:${ds===td?'var(--accent)':'var(--text3)'};font-size:11px;font-family:var(--mono)">${TR_GUN[wd.getDay()===0?6:wd.getDay()-1]}<br><strong style="font-size:14px">${wd.getDate()}</strong></div>
          <div style="min-height:120px;background:var(--bg2);border:1px solid var(--border);border-top:none;border-radius:0 0 4px 4px;padding:4px;cursor:pointer" onclick="gorevYeni('${ds}')">
            ${tasks.map(g=>`<div onclick="event.stopPropagation();gorevDetay('${g.id}')" style="font-size:10px;padding:3px 5px;border-radius:3px;margin-bottom:3px;background:${gRenk(g.kategori)}22;color:${gRenk(g.kategori)};border-left:2px solid ${gRenk(g.kategori)}">${g.baslik}<br><span style="opacity:.7">${g.atanan||''}</span></div>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`;
}
function gorevYeni(ds){
  const uOpts=C.Users.filter(u=>u.active==='true'||u.active===true).map(u=>`<option value="${u.username}">${u.ad||u.username}</option>`).join('');
  showModal('Yeni Görev',`
    <div class="form-row"><div class="form-group"><label>Görev Başlığı *</label><input type="text" id="g-baslik" placeholder="ör: HPLC Kalibrasyonu"></div>
    <div class="form-group"><label>Kategori</label><select id="g-kat">${GOREV_KAT.map(k=>`<option>${k}</option>`).join('')}</select></div></div>

let fileCache=[],fileSearch='',fileFolder='';
async function driveApi(action,payload={}){
  const res=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action,...payload})});
  const data=await res.json();if(data.error)throw new Error(data.error);return data;
}
function fileSize(n){n=Number(n)||0;if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB';}
function fileIcon(mime,name){const n=(name||'').toLowerCase();if((mime||'').includes('image'))return'▧';if(n.endsWith('.pdf'))return'▣';if(n.match(/\.(xlsx|xls|csv)$/))return'▦';if(n.match(/\.(docx|doc)$/))return'▤';return'◇';}
function fileToBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]||'');r.onerror=reject;r.readAsDataURL(file);});}
async function dosyalar(){
  document.getElementById('topbar-actions').innerHTML=`<button class="btn btn-primary btn-sm" onclick="dosyaModal()">+ Dosya Yükle</button>`;
  await renderDosyalar();
}
async function renderDosyalar(q=fileSearch,folder=fileFolder){
  fileSearch=q;fileFolder=folder;
  document.getElementById('content').innerHTML=`<div class="empty-state"><div class="spinner" style="margin:0 auto 12px"></div><div>Drive dosyaları yükleniyor...</div></div>`;
  try{
    const data=await driveApi('listFiles');fileCache=data.files||[];
    const folders=[...new Set(fileCache.map(f=>f.folder||'Genel'))].sort((a,b)=>a.localeCompare(b,'tr'));
    let rows=[...fileCache];
    if(folder)rows=rows.filter(f=>(f.folder||'Genel')===folder);
    if(q){const s=q.toLowerCase();rows=rows.filter(f=>(f.name||'').toLowerCase().includes(s)||(f.description||'').toLowerCase().includes(s)||(f.folder||'').toLowerCase().includes(s));}
    rows.sort((a,b)=>new Date(b.created||0)-new Date(a.created||0));
    document.getElementById('content').innerHTML=`
      <div class="filter-bar">
        <div class="search-bar" style="min-width:260px;flex:1"><span class="search-icon">⌕</span><input type="text" placeholder="Dosya ara..." value="${esc(q)}" oninput="renderDosyalar(this.value,fileFolder)"></div>
        <button class="filter-btn ${folder===''?'active':''}" onclick="renderDosyalar(fileSearch,'')">Tümü (${fileCache.length})</button>
        ${folders.map(f=>`<button class="filter-btn ${folder===f?'active':''}" onclick="renderDosyalar(fileSearch,${JSON.stringify(f).replace(/"/g,'&quot;')})">${esc(f)}</button>`).join('')}
      </div>
      ${rows.length?`<div class="file-grid">${rows.map(f=>`
        <div class="file-card">
          <div class="flex gap-12"><div class="file-icon">${fileIcon(f.mimeType,f.name)}</div><div style="min-width:0"><div class="file-name">${esc(f.name)}</div><div class="file-meta">${esc(f.folder||'Genel')} · ${fileSize(f.size)}</div></div></div>
          ${f.description?`<div class="text-sm text-muted">${esc(f.description)}</div>`:''}
          <div class="file-meta">Yükleyen: ${esc(f.uploadedBy||'—')}<br>${fmtDt(f.created)}</div>
          <div class="file-actions"><a class="btn btn-ghost btn-sm" href="${esc(f.url)}" target="_blank">Aç ↗</a><a class="btn btn-ghost btn-sm" href="${esc(f.downloadUrl||f.url)}" target="_blank">İndir</a>${canDelete()?`<button class="btn btn-danger btn-sm" onclick="dosyaSil('${f.id}')">Sil</button>`:''}</div>
        </div>`).join('')}</div>`:`<div class="empty-state"><div class="empty-icon">▣</div><div>Dosya bulunamadı.</div></div>`}`;
  }catch(e){
    document.getElementById('content').innerHTML=`<div class="alert alert-amber">Drive bağlantısı henüz aktif değil. Apps Script dosya depolama kodunu ekleyip deployment güncellendiğinde bu sayfa çalışacak.<br><br><strong>Hata:</strong> ${esc(e.message)}</div>`;
  }
}
function dosyaModal(){
  showModal('Drive Dosya Yükle',`
    <div class="file-drop">
      <div class="td-main">Dosya seç</div>
      <div class="text-sm text-muted mt-8">Dosyalar Google Drive'daki Arsen Lab klasörüne yüklenir. Büyük dosyalarda 20 MB altı önerilir.</div>
      <input type="file" id="file-input">
    </div>
    <div class="form-row mt-16"><div class="form-group"><label>Klasör / Kategori</label><input type="text" id="file-folder" value="${esc(fileFolder||'Genel')}" placeholder="Genel, Analiz, Satın Alma..."></div>
    <div class="form-group"><label>Görünecek Ad (opsiyonel)</label><input type="text" id="file-name" placeholder="Boşsa dosya adı kullanılır"></div></div>
    <div class="form-group"><label>Açıklama</label><textarea id="file-desc" placeholder="Kısa not, proje veya içerik bilgisi"></textarea></div>`,
    `<button class="btn btn-ghost" onclick="closeModalDirect()">İptal</button><button class="btn btn-primary" onclick="dosyaYukle()">Yükle</button>`);
}
async function dosyaYukle(){
  const input=document.getElementById('file-input'),file=input.files&&input.files[0];if(!file){toast('Dosya seçmelisiniz.','err');return;}
  if(file.size>20*1024*1024&&!confirm('Dosya 20 MB üzerinde. Apps Script sınırına takılabilir, yine de denensin mi?'))return;
  loading(true,'Dosya Drive’a yükleniyor...');
  try{
    const base64=await fileToBase64(file);
    await driveApi('uploadFile',{name:document.getElementById('file-name').value.trim()||file.name,mimeType:file.type||'application/octet-stream',base64,folder:document.getElementById('file-folder').value.trim()||'Genel',description:document.getElementById('file-desc').value,uploadedBy:currentUser.ad||currentUser.username});
    closeModalDirect();loading(false);toast('Dosya yüklendi ✓');await renderDosyalar(fileSearch,fileFolder);
  }catch(e){loading(false);toast('Yükleme hatası: '+e.message,'err');}
}
async function dosyaSil(id){
  if(!canDelete()){toast('Dosyayı yalnızca admin silebilir.','err');return;}
  if(!confirm('Bu dosya Drive’dan silinsin mi?'))return;
  loading(true,'Dosya siliniyor...');
  try{await driveApi('deleteFile',{id});loading(false);toast('Dosya silindi.','err');await renderDosyalar(fileSearch,fileFolder);}
  catch(e){loading(false);toast('Silme hatası: '+e.message,'err');}
}

function mesaiStatusBadge(s){

}
function mesaiSaat(r){return `${r.baslangic||'--:--'} - ${r.bitis||'--:--'}`;}
function mesaiToplam(rows,status){return rows.filter(r=>!status||r.durum===status).reduce((n,r)=>n+(parseFloat(r.toplamSaat)||0),0);}
async function mesai(){
  document.getElementById('topbar-actions').innerHTML=`<button class="btn btn-primary btn-sm" onclick="mesaiYeni()">+ Mesai Kaydı</button>`;

      <div class="filter-bar">
        ${['all','Bekliyor','Onaylandı','Reddedildi'].map(f=>`<button class="filter-btn ${filter===f?'active':''}" onclick="renderMesai('${f}')">${f==='all'?'Tümü':f}</button>`).join('')}

function mesaiYeni(){
  showModal('Ekstra Mesai Kaydı',`
    <div class="form-row"><div class="form-group"><label>Tarih *</label><input type="date" id="m-tarih" value="${today()}"></div>
    <div class="form-group"><label>Mola (dk)</label><input type="number" id="m-mola" value="0" min="0"></div></div>
    <div class="form-row"><div class="form-group"><label>Başlangıç *</label><input type="time" id="m-bas"></div>
    <div class="form-group"><label>Bitiş *</label><input type="time" id="m-bit"></div></div>
    <div class="form-group"><label>Açıklama / Yapılan İş</label><textarea id="m-aciklama" placeholder="Kısa açıklama yazın"></textarea></div>`,
    `<button class="btn btn-ghost" onclick="closeModalDirect()">İptal</button><button class="btn btn-primary" onclick="mesaiKaydet()">Onaya Gönder</button>`);
}
function mesaiHesapla(bas,bit,mola){
  if(!bas||!bit)return 0;
  const [bh,bm]=bas.split(':').map(Number),[eh,em]=bit.split(':').map(Number);
  let start=bh*60+bm,end=eh*60+em;if(end<start)end+=1440;
  return Math.max(0,(end-start-(parseFloat(mola)||0))/60);
}
async function mesaiKaydet(){
  const tarih=document.getElementById('m-tarih').value,bas=document.getElementById('m-bas').value,bit=document.getElementById('m-bit').value,mola=document.getElementById('m-mola').value||'0';
  if(!tarih||!bas||!bit){toast('Tarih ve saat aralığı zorunlu.','err');return;}
  const toplam=mesaiHesapla(bas,bit,mola);if(toplam<=0){toast('Geçerli bir saat aralığı girin.','err');return;}
  loading(true,'Mesai kaydı onaya gönderiliyor...');
  try{
    await driveApi('createOvertime',{kullanici:currentUser.username,kullaniciAd:currentUser.ad||currentUser.username,tarih,baslangic:bas,bitis:bit,molaDakika:mola,toplamSaat:toplam.toFixed(2),aciklama:document.getElementById('m-aciklama').value});
    closeModalDirect();loading(false);toast('Mesai kaydı onaya gönderildi ✓');await renderMesai();
  }catch(e){loading(false);toast('Mesai kaydedilemedi: '+e.message,'err');}
}
async function mesaiOnay(id,durum){

  catch(e){loading(false);toast('Onay hatası: '+e.message,'err');}
}
